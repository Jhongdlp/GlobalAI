server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;
  # Grabaciones de Speaking: la API corta en 5 MB; nginx por defecto solo acepta 1 MB.
  client_max_body_size 6m;
  location / { try_files $uri $uri/index.html $uri.html =404; }
  # Mismo origen que la web: la cookie httpOnly viaja sin CORS. API_URL lo pone el Dockerfile/compose.
  location /api/ {
    proxy_pass ${API_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
  }
  # El service worker nunca debe quedar cacheado: si no, los usuarios no reciben versiones nuevas.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  error_page 404 /404.html;
}
