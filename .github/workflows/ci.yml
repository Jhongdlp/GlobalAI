name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: globalai
          POSTGRES_PASSWORD: globalai
          POSTGRES_DB: globalai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U globalai" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build

  # El stack completo (Postgres + migraciones + seed + API) debe levantar tal como lo corre un evaluador.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8000/api/v1/health
      # La web sirve el sitio y reenvía /api a la API (mismo origen, como en producción).
      - run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8080/api/v1/health
      - if: failure()
        run: docker compose logs api web
      - if: always()
        run: docker compose down -v

  # CD: solo si todo lo anterior pasó en main, publica la imagen de la API en GHCR.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
